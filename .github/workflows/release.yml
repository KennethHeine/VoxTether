name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Validate and set version
      id: version
      run: |
        $version = "${{ github.event.inputs.version }}"
        # Remove 'v' prefix if provided
        $version = $version -replace '^v', ''
        # Validate semver format (basic validation for X.Y.Z with optional prerelease/metadata)
        if (-not ($version -match '^\d+\.\d+\.\d+(-[\w-]+(\.[\w-]+)*)?(\+[\w-]+(\.[\w-]+)*)?$')) {
          Write-Error "Invalid version format: $version. Expected format: X.Y.Z (e.g., 1.0.0)"
          exit 1
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements*.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest tests/ -v --tb=short

    - name: Update version in pyproject.toml
      run: |
        $content = Get-Content -Path pyproject.toml -Raw
        $content = $content -replace 'version = ".*"', 'version = "${{ steps.version.outputs.VERSION }}"'
        Set-Content -Path pyproject.toml -Value $content
      shell: pwsh

    - name: Build executable with PyInstaller
      run: python build.py --output dist

    - name: Create portable ZIP
      run: |
        Compress-Archive -Path ./dist/VoxTether.exe -DestinationPath ./VoxTether-${{ steps.version.outputs.VERSION }}-win-x64.zip
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: VoxTether v${{ steps.version.outputs.VERSION }}
        body: |
          ## VoxTether v${{ steps.version.outputs.VERSION }}
          
          Push-to-talk dictation for Windows. Fully offline using faster-whisper.
          
          ### Download
          
          - `VoxTether-${{ steps.version.outputs.VERSION }}-win-x64.zip` - Portable executable
          
          ### Installation
          
          1. Download and extract the ZIP file
          2. Run `VoxTether.exe`
          3. On first launch, you'll be prompted to download a speech recognition model
          
          ### Requirements
          
          - Windows 10/11 (64-bit)
          - NVIDIA GPU with CUDA 12 support (optional, for GPU acceleration)
          
          See [Installation Guide](https://github.com/KennethHeine/VoxTether/blob/main/docs/INSTALLATION.md) for detailed instructions.
        files: ./VoxTether-${{ steps.version.outputs.VERSION }}-win-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
