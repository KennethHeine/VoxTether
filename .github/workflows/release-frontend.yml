name: Release Frontend

run-name: Release Frontend ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Build and release the Electron frontend
  build-and-release:
    name: Build and Release Frontend
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate and set version
      id: version
      run: |
        $version = "${{ github.event.inputs.version }}"
        $version = $version -replace '^v', ''
        if (-not ($version -match '^\d+\.\d+\.\d+(-[\w-]+(\.[\w-]+)*)?(\+[\w-]+(\.[\w-]+)*)?$')) {
          Write-Error "Invalid version format: $version. Expected format: X.Y.Z (e.g., 2.0.0)"
          exit 1
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.12.0'
        cache: 'npm'
        cache-dependency-path: 'src/frontend-electron/package-lock.json'

    - name: Update package version
      run: |
        cd src/frontend-electron
        npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
      shell: pwsh

    - name: Install dependencies
      run: |
        cd src/frontend-electron
        npm ci
      shell: pwsh

    - name: Build Electron app
      run: |
        cd src/frontend-electron
        npx electron-builder --win --x64 --publish never
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: frontend-v${{ steps.version.outputs.VERSION }}
        name: VoxTether Frontend v${{ steps.version.outputs.VERSION }}
        body: |
          ## VoxTether Frontend v${{ steps.version.outputs.VERSION }}
          
          Desktop UI for VoxTether - push-to-talk dictation application.
          
          ### Download
          
          - **`VoxTether-${{ steps.version.outputs.VERSION }}-Setup.exe`** - Windows installer
          
          ### Installation
          
          1. Download and run `VoxTether-${{ steps.version.outputs.VERSION }}-Setup.exe`
          2. Follow the installation wizard
          3. Launch VoxTether from the Start Menu
          
          ### First Run
          
          1. Ensure the VoxTether Backend is running (see [VoxTether-backend](https://github.com/KennethHeine/VoxTether-backend))
          2. On first launch, you'll be prompted to download a speech recognition model (recommended: "small" model)
          3. Press Ctrl+Shift+R (default hotkey) to record
          4. Release to transcribe and paste the text
          
          ### Requirements
          
          - Windows 10/11 (64-bit)
          - VoxTether Backend running on localhost:5678
          
          ### What's Included
          
          This is the **frontend component only**. It provides:
          - System tray application with push-to-talk hotkey
          - Audio recording and streaming to the backend
          - Automatic text pasting after transcription
          - Settings management (hotkey, model selection)
          
          > **Note:** For speech-to-text transcription, you also need the VoxTether Backend (see [VoxTether-backend](https://github.com/KennethHeine/VoxTether-backend)).
          
          See [Installation Guide](https://github.com/KennethHeine/VoxTether/blob/main/docs/INSTALLATION.md) for detailed setup instructions.
        files: |
          src/frontend-electron/dist/VoxTether-${{ steps.version.outputs.VERSION }}-Setup.exe
          src/frontend-electron/dist/latest.yml
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
