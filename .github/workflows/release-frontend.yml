name: Release Frontend

run-name: Release Frontend ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Build the Electron frontend
  build-frontend:
    name: Build Frontend
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate and set version
      id: version
      run: |
        $version = "${{ github.event.inputs.version }}"
        $version = $version -replace '^v', ''
        if (-not ($version -match '^\d+\.\d+\.\d+(-[\w-]+(\.[\w-]+)*)?(\+[\w-]+(\.[\w-]+)*)?$')) {
          Write-Error "Invalid version format: $version. Expected format: X.Y.Z (e.g., 2.0.0)"
          exit 1
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/frontend-electron/package-lock.json'

    - name: Update package version
      run: |
        cd src/frontend-electron
        npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
      shell: pwsh

    - name: Install dependencies
      run: |
        cd src/frontend-electron
        npm ci
      shell: pwsh

    - name: Build Electron app
      run: |
        cd src/frontend-electron
        npm run build
      shell: pwsh

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer-build
        path: src/frontend-electron/dist/*-Setup.exe

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: portable-build
        path: src/frontend-electron/dist/win-unpacked/

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

  # Create release
  create-release:
    name: Create Release
    runs-on: windows-latest
    needs: [build-frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Download installer artifact
      uses: actions/download-artifact@v7
      with:
        name: installer-build
        path: build/installer/

    - name: Download portable artifact
      uses: actions/download-artifact@v7
      with:
        name: portable-build
        path: build/portable/

    - name: Create portable ZIP
      run: |
        $version = "${{ needs.build-frontend.outputs.version }}"
        
        # Create README
        $readme = @"
        VoxTether $version
        ==================
        
        Push-to-talk dictation for Windows. Fully offline speech-to-text.
        
        Getting Started:
        1. Run VoxTether.exe
        2. On first run, you'll be prompted to download a speech recognition model
        3. Press Ctrl+Shift+Space (default hotkey) to record
        4. Release to transcribe and paste the text
        
        Requirements:
        - Windows 10/11 (64-bit)
        - For GPU acceleration: NVIDIA GPU with CUDA support
        
        For more information, visit:
        https://github.com/KennethHeine/VoxTether
        
        License: MIT
        "@
        $readme | Out-File "build\portable\README.txt" -Encoding UTF8
        
        # Copy license
        if (Test-Path "LICENSE") {
          Copy-Item "LICENSE" "build\portable\LICENSE.txt"
        }
        
        # Create ZIP
        Compress-Archive -Path "build\portable\*" -DestinationPath "build\VoxTether-$version-win-x64.zip"
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.build-frontend.outputs.version }}
        name: VoxTether v${{ needs.build-frontend.outputs.version }}
        body: |
          ## VoxTether v${{ needs.build-frontend.outputs.version }}
          
          Push-to-talk dictation for Windows. Fully offline using faster-whisper.
          
          ### Downloads
          
          - **`VoxTether-${{ needs.build-frontend.outputs.version }}-Setup.exe`** - Windows installer (recommended)
          - **`VoxTether-${{ needs.build-frontend.outputs.version }}-win-x64.zip`** - Portable ZIP
          
          ### Installation
          
          **Using Installer (Recommended):**
          1. Download and run `VoxTether-${{ needs.build-frontend.outputs.version }}-Setup.exe`
          2. Follow the installation wizard
          3. Launch VoxTether from the Start Menu
          
          **Using Portable ZIP:**
          1. Download and extract the ZIP file
          2. Run `VoxTether.exe`
          
          ### First Run
          
          On first launch, you'll be prompted to download a speech recognition model (recommended: "small" model).
          
          ### Requirements
          
          - Windows 10/11 (64-bit)
          - NVIDIA GPU with CUDA 12 support (optional, for GPU acceleration)
          
          See [Installation Guide](https://github.com/KennethHeine/VoxTether/blob/main/docs/INSTALLATION.md) for detailed instructions.
          
          ### Architecture
          
          This release uses a hybrid architecture:
          - **Frontend**: Electron.js - Cross-platform desktop UI
          - **Backend**: Python FastAPI - faster-whisper transcription
          
          See [Architecture Documentation](https://github.com/KennethHeine/VoxTether/blob/main/docs/ARCHITECTURE.md) for details.
        files: |
          build/installer/VoxTether-${{ needs.build-frontend.outputs.version }}-Setup.exe
          build/VoxTether-${{ needs.build-frontend.outputs.version }}-win-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
