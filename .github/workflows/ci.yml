name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  # Build and test the C# version
  build-dotnet:
    name: Build (.NET)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: |
        dotnet test --no-build --configuration Release `
          --verbosity normal `
          --logger "console;verbosity=detailed" `
          --logger "trx;LogFileName=unit-test-results.trx" `
          --filter "Category!=Integration"
      continue-on-error: false

    - name: Run Integration Tests
      run: |
        dotnet test --no-build --configuration Release `
          --verbosity normal `
          --logger "console;verbosity=detailed" `
          --logger "trx;LogFileName=integration-test-results.trx" `
          --filter "Category=Integration"
      continue-on-error: false

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: dotnet-test-results
        path: |
          **/unit-test-results.trx
          **/integration-test-results.trx
        retention-days: 7

  # Build and test the Python version
  build-python:
    name: Build (Python)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'voxtether-python/requirements*.txt'

    - name: Install dependencies
      working-directory: voxtether-python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linting (ruff)
      working-directory: voxtether-python
      run: ruff check src/ tests/
      continue-on-error: true

    - name: Run tests
      working-directory: voxtether-python
      run: pytest tests/ -v --tb=short

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: python-test-results
        path: voxtether-python/.pytest_cache/
        retention-days: 7
