name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  # Test the Python backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: 'src/backend/requirements.txt'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/backend/requirements.txt

    - name: Run backend linting (ruff)
      run: |
        pip install ruff
        ruff check src/backend/
      continue-on-error: true

    - name: Test backend starts correctly
      run: |
        cd src/backend
        timeout 10 python -m uvicorn main:app --host 127.0.0.1 --port 5678 &
        sleep 5
        curl -f http://127.0.0.1:5678/api/health || echo "Health check failed"
      continue-on-error: true

  # Build the Electron frontend
  build-frontend:
    name: Build Frontend (Electron)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/frontend-electron/package-lock.json'

    - name: Install dependencies
      run: |
        cd src/frontend-electron
        npm install
      shell: pwsh

    - name: Run linting
      run: |
        cd src/frontend-electron
        npm run lint
      continue-on-error: true
      shell: pwsh

    - name: Build Electron app
      run: |
        cd src/frontend-electron
        npm run pack
      shell: pwsh

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: src/frontend-electron/dist/
        retention-days: 7

  # Run Playwright E2E tests for Electron frontend
  test-frontend-e2e:
    name: Test Frontend (Playwright E2E)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/frontend-electron/package-lock.json'

    - name: Install dependencies
      run: |
        cd src/frontend-electron
        npm install

    - name: Run Playwright tests
      run: |
        cd src/frontend-electron
        xvfb-run --auto-servernum npm test

    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-screenshots
        path: src/frontend-electron/screenshots/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-test-results
        path: src/frontend-electron/test-results/
        retention-days: 7

  # Run tests for Python code
  test-python:
    name: Test Python
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: 'requirements*.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linting (ruff)
      run: ruff check src/ tests/
      continue-on-error: true

    - name: Run tests
      run: pytest tests/ -v --tb=short

  # Combined build verification
  build-complete:
    name: Build Complete
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, test-frontend-e2e, test-python]

    steps:
    - name: Verify builds
      run: |
        echo "All builds and tests completed successfully!"
        echo ""
        echo "Deployment:"
        echo "  Backend: Deploy Python code to server, run with 'python -m uvicorn main:app --port 5678'"
        echo "  Frontend: Distribute Electron app to clients"
