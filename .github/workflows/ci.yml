name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  # Build and test the Python backend
  build-backend:
    name: Build Backend
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'src/backend/requirements.txt'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/backend/requirements.txt
        pip install pyinstaller

    - name: Run backend linting (ruff)
      run: |
        pip install ruff
        ruff check src/backend/
      continue-on-error: true

    - name: Build backend with PyInstaller
      run: |
        cd src/backend
        pyinstaller --onefile --name vox-backend main.py
      shell: pwsh

    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: src/backend/dist/vox-backend.exe
        retention-days: 7

  # Build the WinUI 3 frontend (legacy .NET)
  build-frontend-dotnet:
    name: Build Frontend (.NET)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/frontend/VoxTether.sln

    - name: Build frontend
      run: |
        dotnet build src/frontend/VoxTether.sln -c Release --no-restore
      shell: pwsh

    - name: Publish frontend
      run: |
        dotnet publish src/frontend/VoxTether/VoxTether.csproj `
          -c Release `
          -r win-x64 `
          --self-contained `
          -p:PublishSingleFile=false `
          -o build/output
      shell: pwsh

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dotnet-build
        path: build/output/
        retention-days: 7

  # Build the Electron frontend
  build-frontend-electron:
    name: Build Frontend (Electron)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/frontend-electron/package-lock.json'

    - name: Install dependencies
      run: |
        cd src/frontend-electron
        npm install
      shell: pwsh

    - name: Run linting
      run: |
        cd src/frontend-electron
        npm run lint
      continue-on-error: true
      shell: pwsh

    - name: Build Electron app
      run: |
        cd src/frontend-electron
        npm run pack
      shell: pwsh

    - name: Upload Electron frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-electron-build
        path: src/frontend-electron/dist/
        retention-days: 7

  # Run tests for legacy Python code
  test-python:
    name: Test Python
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements*.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linting (ruff)
      run: ruff check src/ tests/
      continue-on-error: true

    - name: Run tests
      run: pytest tests/ -v --tb=short

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: .pytest_cache/
        retention-days: 7

  # Combined build verification
  build-complete:
    name: Build Complete
    runs-on: windows-latest
    needs: [build-backend, build-frontend-dotnet, build-frontend-electron, test-python]

    steps:
    - uses: actions/checkout@v4

    - name: Download backend artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-build
        path: build/output/backend/

    - name: Download .NET frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dotnet-build
        path: build/output-dotnet/

    - name: Download Electron frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-electron-build
        path: build/output-electron/

    - name: Verify build
      run: |
        Write-Host "Checking build artifacts..."
        
        # Check .NET frontend
        if (-not (Test-Path "build/output-dotnet/VoxTether.exe")) {
          Write-Warning ".NET Frontend executable not found!"
        } else {
          Write-Host ".NET Frontend build OK" -ForegroundColor Green
        }
        
        # Check Electron frontend
        if (Test-Path "build/output-electron/win-unpacked/VoxTether.exe") {
          Write-Host "Electron Frontend build OK" -ForegroundColor Green
        } else {
          Write-Warning "Electron Frontend executable not found in expected location"
          Get-ChildItem -Path "build/output-electron" -Recurse | Format-Table Name, Length
        }
        
        # Check backend
        if (-not (Test-Path "build/output/backend/vox-backend.exe")) {
          Write-Error "Backend executable not found!"
          exit 1
        } else {
          Write-Host "Backend build OK" -ForegroundColor Green
        }
        
        Write-Host "Build verification passed!" -ForegroundColor Green
      shell: pwsh

    - name: Upload combined build (Electron)
      uses: actions/upload-artifact@v4
      with:
        name: voxtether-electron-build
        path: |
          build/output-electron/
          build/output/backend/
        retention-days: 7

    - name: Upload combined build (.NET)
      uses: actions/upload-artifact@v4
      with:
        name: voxtether-dotnet-build
        path: |
          build/output-dotnet/
          build/output/backend/
        retention-days: 7
