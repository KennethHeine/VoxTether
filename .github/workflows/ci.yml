name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  # Detect which components changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          backend:
            - 'src/backend/**'
          frontend:
            - 'src/frontend-electron/**'
          workflows:
            - '.github/workflows/**'

  # Test the Python backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: 'src/backend/requirements.txt'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/backend/requirements.txt

    - name: Run backend linting (ruff)
      run: |
        pip install ruff
        ruff check src/backend/
      continue-on-error: true

    - name: Test backend starts correctly
      run: |
        cd src/backend
        timeout 10 python -m uvicorn main:app --host 127.0.0.1 --port 5678 &
        sleep 5
        curl -f http://127.0.0.1:5678/api/health || echo "Health check failed"
      continue-on-error: true

  # Build the Electron frontend
  build-frontend:
    name: Build Frontend (Electron)
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/frontend-electron/package-lock.json'

    - name: Install dependencies
      run: |
        cd src/frontend-electron
        npm install
      shell: pwsh

    - name: Run linting
      run: |
        cd src/frontend-electron
        npm run lint
      continue-on-error: true
      shell: pwsh

    - name: Build Electron app
      run: |
        cd src/frontend-electron
        npm run pack
      shell: pwsh

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: src/frontend-electron/dist/
        retention-days: 7

  # Run Playwright E2E tests for Electron frontend
  test-frontend-e2e:
    name: Test Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/frontend-electron/package-lock.json'

    - name: Install dependencies
      run: |
        cd src/frontend-electron
        npm install

    - name: Run Playwright tests
      run: |
        cd src/frontend-electron
        xvfb-run --auto-servernum npm test

    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-screenshots
        path: src/frontend-electron/screenshots/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-test-results
        path: src/frontend-electron/test-results/
        retention-days: 7

  # Combined build verification
  build-complete:
    name: Build Complete
    runs-on: ubuntu-latest
    needs: [changes, test-backend, build-frontend, test-frontend-e2e]
    if: always()

    steps:
    - name: Check results
      run: |
        # Check if any required jobs failed (skipped is OK for conditional jobs)
        BACKEND_RESULT="${{ needs.test-backend.result }}"
        FRONTEND_BUILD_RESULT="${{ needs.build-frontend.result }}"
        FRONTEND_E2E_RESULT="${{ needs.test-frontend-e2e.result }}"
        
        echo "Job results:"
        echo "  test-backend: $BACKEND_RESULT"
        echo "  build-frontend: $FRONTEND_BUILD_RESULT"
        echo "  test-frontend-e2e: $FRONTEND_E2E_RESULT"
        
        # Fail if any job failed (but skipped is acceptable)
        if [ "$BACKEND_RESULT" == "failure" ] || \
           [ "$FRONTEND_BUILD_RESULT" == "failure" ] || \
           [ "$FRONTEND_E2E_RESULT" == "failure" ]; then
          echo "::error::Some jobs failed"
          exit 1
        fi
        
        # Check if at least one job ran (not all skipped)
        if [ "$BACKEND_RESULT" == "skipped" ] && \
           [ "$FRONTEND_BUILD_RESULT" == "skipped" ] && \
           [ "$FRONTEND_E2E_RESULT" == "skipped" ]; then
          echo "::warning::All jobs were skipped - no component changes detected"
        fi
        
        echo ""
        echo "All triggered builds and tests completed successfully!"
        echo ""
        echo "Changes detected:"
        echo "  Backend: ${{ needs.changes.outputs.backend }}"
        echo "  Frontend: ${{ needs.changes.outputs.frontend }}"
        echo "  Workflows: ${{ needs.changes.outputs.workflows }}"
