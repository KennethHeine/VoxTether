[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtether"
version = "2.0.0"
description = "Push-to-talk dictation for Windows. Fully offline using faster-whisper."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "VoxTether Team"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["speech-to-text", "dictation", "whisper", "transcription", "voice"]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pystray>=0.19.5",
    "keyboard>=0.13.5",
    "pyperclip>=1.8.2",
    "Pillow>=10.2.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pyinstaller>=6.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
cuda = [
    "nvidia-cublas-cu12>=12.1.0.26",
    "nvidia-cudnn-cu12>=8.9.0",
]

[project.scripts]
voxtether = "main:main"

[project.urls]
Homepage = "https://github.com/KennethHeine/VoxTether"
Repository = "https://github.com/KennethHeine/VoxTether"
Issues = "https://github.com/KennethHeine/VoxTether/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
